# Beispiel-Konfiguration für Nginx als Reverse-Proxy vor Webmail.
# Domain und Zertifikatspfade anpassen, z. B. nach /etc/nginx/sites-available/ kopieren.
# Die App lauscht laut .env auf 127.0.0.1:8080 (HTTP_BIND/HTTP_PORT).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;

    # Anhänge (Base64 im JSON) – passend zu MAX_UPLOAD_MB (Standard 35)
    client_max_body_size 40m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Komprimierung: Die Webmail komprimiert Oberfläche und API-Antworten bereits selbst
    # (Brotli/gzip). Diese Zeilen greifen nur für Antworten, die noch unkomprimiert sind.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml text/calendar text/vcard;

    # Gemeinsame Proxy-Einstellungen
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket für Push (neue Mails, Zähler)
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Web-Oberfläche und API
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;   # Konto-Test / Versand können etwas dauern
    }
}
